name: Verify RecoverX
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[desktop,dev]"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 ntfs-3g
      - run: ruff check src tests scripts
      - run: ruff format --check --diff src tests scripts
      - run: pytest -q --junitxml=artifacts/python-tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
          RECOVERX_REQUIRE_NTFS_TOOLS: '1'
      - run: python -m recoverx.desktop --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results-${{ matrix.os }}
          path: artifacts/python-tests.xml
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S packages/recovery-core -B build/native
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
  windows-recovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Windows deletion, raw drive reader and image export
        shell: pwsh
        run: ./scripts/verify-windows-recovery.ps1
  package:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: [python, web, native, windows-recovery]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -e ".[desktop,dev]"
      - run: choco install innosetup --no-progress -y
      - run: ./scripts/package-windows.ps1
      - name: Verify packaged startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = Start-Process -FilePath ./dist/RecoverX/RecoverX.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Packaged startup timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged startup failed: $($app.ExitCode)" }
      - name: Verify install, installed startup and uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/verify-installer.ps1
      - name: Archive portable application and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path ./dist/RecoverX -DestinationPath ./dist/RecoverX-Portable-0.3.0.zip
          Get-FileHash ./dist/RecoverX-Portable-0.3.0.zip, ./dist/installer/RecoverX-Setup-0.3.0.exe -Algorithm SHA256 | Format-List | Out-File ./dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer-for-validation
          path: |
            dist/installer/*
            dist/RecoverX-Portable-0.3.0.zip
            dist/SHA256.txt
