name: Verify RecoverX
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[desktop,dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q --junitxml=artifacts/python-tests.xml
      - run: python -m recoverx.desktop --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results-${{ matrix.os }}
          path: artifacts/python-tests.xml
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S packages/recovery-core -B build/native
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
  package:
    if: github.event_name == 'workflow_dispatch'
    needs: [python, web, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -e ".[desktop,dev]"
      - run: choco install innosetup --no-progress -y
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer-for-validation
          path: dist/installer/*
